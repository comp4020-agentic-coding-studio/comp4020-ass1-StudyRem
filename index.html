<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's actually in the loop? — an agent tool-call explainer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>What's actually happening in that agent loop?</h1>
      <p class="hook">
        You've watched an agent "think" for thirty seconds and use six tools.
        What actually happened in that time? Step through one real loop,
        one turn at a time.
      </p>

      <section class="loop-demo" aria-label="Agent tool-call loop demo">
        <div class="loop-controls">
          <button id="step-btn" type="button" data-testid="step-button">
            Step →
          </button>
          <p class="loop-caption" id="loop-caption" aria-live="polite">
            Click "Step" to send the first message.
          </p>
        </div>

        <ol class="transcript" id="transcript" aria-label="Conversation transcript" data-testid="transcript"></ol>
      </section>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
